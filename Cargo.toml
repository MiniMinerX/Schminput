[package]
name = "schminput"
license.workspace = true
version.workspace = true
edition.workspace = true
repository.workspace = true
description = "An Action Based Input Manager for Bevy"
keywords = ["bevy", "input", "vr", "xr", "action"]

[workspace.package]
license = "MIT OR Apache-2.0"
version = "0.5.0"
edition = "2024"
repository = "https://github.com/Schmarni-Dev/Schminput/"

[workspace]
resolver = "2"
members = ["schminput_rebinding"]

[workspace.lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(feature, values("dlopen"))'] }

[workspace.dependencies]
schminput = { path = ".", version = "0.5.0" }

# Bevy 0.19 — crates.io to match MiniMinerX/bevy_oxr.
bevy = { version = "0.19", default-features = false, features = [
    "serialize",
    "bluenoise_texture",
    "experimental_pbr_pcss",
    "jpeg",
    "bevy_gilrs",
    "zstd_rust",
    "keyboard",
    "mouse",
] }

# OpenXR — MiniMinerX/bevy_oxr on the bevy-0.19-no-static branch.
bevy_mod_openxr = { git = "https://github.com/MiniMinerX/bevy_oxr", branch = "bevy-0.19-no-static", package = "bevy_mod_openxr", version = "0.6.0" }
bevy_mod_xr = { git = "https://github.com/MiniMinerX/bevy_oxr", branch = "bevy-0.19-no-static", package = "bevy_mod_xr", version = "0.6.0" }
bevy_xr_utils = { git = "https://github.com/MiniMinerX/bevy_oxr", branch = "bevy-0.19-no-static", package = "bevy_xr_utils", version = "0.6.0" }

openxr = { version = "0.21", default-features = false }

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

[[example]]
name = "xr"
required-features = ["xr"]
[[example]]
name = "xr_actionset_priorities"
required-features = ["xr"]

[features]
default = []
xr = ["dep:bevy_mod_openxr", "dep:bevy_mod_xr", "dep:openxr"]
# Note: the previous `raw_vulkan_init` feature forwarded a feature from bevy_mod_openxr
# that no longer exists in the MiniMinerX/bevy-0.19-no-static fork.
# If raw Vulkan instance creation is needed, enable the appropriate features directly
# on bevy_mod_openxr (e.g. "vulkan") or use bevy_mod_openxr's public API.

[dependencies]
atomicow = "1.0.0"
bevy = { workspace = true, features = ["bevy_log"] }
bevy_mod_xr = { workspace = true, optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
openxr = { workspace = true, optional = true }
bevy_mod_openxr = { workspace = true, optional = true }

[dev-dependencies]
bevy_mod_openxr = { workspace = true, default-features = true }
bevy = { workspace = true, default-features = true, features = ["zstd_rust"] }
